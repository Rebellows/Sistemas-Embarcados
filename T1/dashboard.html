<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>ESP32 - Painel de Sensores</title>
    <link rel="stylesheet" type="text/css" href="novo_estilo.css">
    <!--refresh automático a cada 2 segundos-->
    <meta http-equiv="refresh" content="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <header>
        <h1>ESP32 - Painel de Sensores</h1>
    </header>

    <main>
        <section class="sensor-grid">

            <div class="sensor-card">
                <svg class="sensor-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3a2 2 0 0 0-2 2v9.17a3.5 3.5 0 1 0 4 0V5a2 2 0 0 0-2-2z" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="12" cy="17" r="2" fill="currentColor"/>
                </svg>
                <p class="sensor-labels">Temperatura</p>
                <p class="sensor-value"><b>%TEMP%</b><sup class="units">&deg;</sup>C</p>
            </div>

            <div class="sensor-card">
                <svg class="sensor-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2s6 7.5 6 12a6 6 0 1 1-12 0c0-4.5 6-12 6-12z" stroke="currentColor" stroke-width="1.6"/>
                </svg>
                <p class="sensor-labels">Umidade</p>
                <p class="sensor-value"><b>%UMID%</b>&#37;</p>
            </div>

            <div class="sensor-card">
                <svg class="sensor-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <p class="sensor-labels">Pressão</p>
                <p class="sensor-value"><b>%PRESS%</b> hPa</p>
            </div>

            <div class="sensor-card">
                <svg class="sensor-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 17l6-9 4 5 3-4 5 8" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
                </svg>
                <p class="sensor-labels">Altitude</p>
                <p class="sensor-value"><b>%ALT%</b> m</p>
            </div>

            <div class="sensor-card">
                <svg class="sensor-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
                    <path d="M12 12c0-3 2-6 5-6 1.7 0 2.5 1.3 1.7 2.7C17.6 10.5 15 12 12 12z" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M12 12c-3 0-6-2-6-5 0-1.7 1.3-2.5 2.7-1.7C10.5 6.4 12 9 12 12z" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M12 12c0 3-2 6-5 6-1.7 0-2.5-1.3-1.7-2.7C6.4 13.5 9 12 12 12z" stroke="currentColor" stroke-width="1.4"/>
                </svg>
                <p class="sensor-labels">Ventilador</p>
                <p class="sensor-value"><b>%VENT%</b></p>
            </div>

        </section>

        <section class="rele-control">
            <p class="sensor-labels">Relé</p>
            <p>
                <a href="/on"><button class="button button1">ON</button></a>
                <a href="/off"><button class="button button2">OFF</button></a>
            </p>
        </section>
    </main>

    <footer>
        <p>Projeto Sistemas Embarcados &middot; ESP32 Web Server</p>
    </footer>

</body>
</html>
